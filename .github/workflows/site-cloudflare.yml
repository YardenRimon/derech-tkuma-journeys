# Prepared review deployment. Install under .github/workflows only with the protected environment configured.
name: Deploy Cloudflare review
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Shared CMS checks']
    types: [completed]
    branches: [main, production-foundation-20261019]
permissions:
  contents: read
  actions: read
concurrency:
  group: derech-cloudflare-review
  cancel-in-progress: false
jobs:
  deploy:
    # This must be a repository-level flag: environment vars are unavailable at jobs.if.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production-foundation-20261019')) ||
      (github.event_name == 'workflow_run' && vars.DERECH_CF_AUTO_DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.name == 'Shared CMS checks' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.status == 'completed' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'production-foundation-20261019'))
    environment: derech-cloudflare-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORKERS_CI_COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DERECH_DEPLOY_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      DERECH_CF_AUTO_DEPLOY_ENABLED: ${{ vars.DERECH_CF_AUTO_DEPLOY_ENABLED }}
      DERECH_CF_VERIFIED_JOB_DEPLOY_ENABLED: ${{ vars.DERECH_CF_VERIFIED_JOB_DEPLOY_ENABLED }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform-cms/package-lock.json
      - name: Refuse an untrusted, superseded or application-free source
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node production/test-cloudflare-cd-policy.mjs
          node production/cloudflare-cd-policy.mjs
      - name: Install locked dependencies
        working-directory: platform-cms
        run: npm ci --no-audit --no-fund
      - name: Materialize non-secret reviewed configuration
        env:
          CF_CONFIG_JSON: ${{ vars.DERECH_CF_CONFIG_JSON }}
        run: |
          test -n "$CF_CONFIG_JSON"
          printf '%s\n' "$CF_CONFIG_JSON" > "$RUNNER_TEMP/derech-cloudflare.json"
          node --input-type=module -e 'import fs from "node:fs";import path from "node:path";const p=process.env.RUNNER_TEMP+"/derech-cloudflare.json",c=JSON.parse(fs.readFileSync(p));c.d1_databases[0].migrations_dir=path.resolve("platform-cms/drizzle");fs.writeFileSync(p,JSON.stringify(c));'
      - name: Hydrate pinned public media
        env:
          MEDIA_URL: ${{ vars.DERECH_MEDIA_ARCHIVE_URL }}
          MEDIA_SHA256: ${{ vars.DERECH_MEDIA_ARCHIVE_SHA256 }}
        run: |
          test -n "$MEDIA_URL" && test -n "$MEDIA_SHA256"
          case "$MEDIA_URL" in https://*) ;; *) exit 1 ;; esac
          curl --fail --silent --show-error --proto '=https' --proto-redir '=https' --location --max-redirs 2 "$MEDIA_URL" -o "$RUNNER_TEMP/derech-media.tgz"
          python3 platform-cms/scripts/hydrate-cloudflare-media.py --archive "$RUNNER_TEMP/derech-media.tgz" --sha256 "$MEDIA_SHA256" --root platform-cms
      - name: Hydrate pinned source snapshot supplement
        run: python3 platform-cms/scripts/hydrate-source-snapshot.py --root platform-cms
      - name: Verify full source reconstruction and tested standalone build
        working-directory: platform-cms
        env:
          PLATFORM_CF_CONFIG_PATH: ${{ runner.temp }}/derech-cloudflare.json
        run: |
          node scripts/build-cloudflare.mjs
      - name: Refuse a superseded queued source commit
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node production/cloudflare-cd-policy.mjs
      - name: Apply schema-only migrations to isolated review DB
        working-directory: platform-cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/validate-cloudflare-artifact.mjs "$RUNNER_TEMP/derech-cloudflare.json"
          npx wrangler d1 migrations apply DB --remote --config "$RUNNER_TEMP/derech-cloudflare.json"
      - name: Deploy checked artifact and verify source identity/noindex
        working-directory: platform-cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node ../production/cloudflare-cd-policy.mjs
          node scripts/validate-cloudflare-artifact.mjs "$RUNNER_TEMP/derech-cloudflare.json"
          npx wrangler deploy --config dist/server/wrangler.json
          node scripts/verify-cloudflare-live.mjs "$RUNNER_TEMP/derech-cloudflare.json"
      - name: Remove temporary build configuration/media
        if: always()
        run: rm -f "$RUNNER_TEMP/derech-cloudflare.json" "$RUNNER_TEMP/derech-media.tgz"
