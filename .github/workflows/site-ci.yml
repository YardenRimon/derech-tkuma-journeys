name: Shared CMS checks
on:
  pull_request:
    paths: ['platform-cms/**', 'production/**', '.github/workflows/site-*.yml']
  push:
    branches: [main, production-foundation-20261019]
    paths: ['platform-cms/**', 'production/**', '.github/workflows/site-*.yml']
permissions:
  contents: read
concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform-cms/package-lock.json
      - name: Install locked application dependencies
        working-directory: platform-cms
        run: npm ci --no-audit --no-fund
      - name: Prepare exact public source templates
        working-directory: platform-cms
        run: npm run prepare:pages
      - name: Check types and content/access/isolation contracts
        working-directory: platform-cms
        run: npm run check && npm test
      - name: Build shared CMS
        working-directory: platform-cms
        run: npm run build
      - name: Verify export and SEO source boundaries
        run: |
          python3 -m unittest discover -s production -p 'test_*.py'
          python3 -m unittest discover -s production/seo -p 'test_*.py'
