name: Shared CMS checks
on:
  pull_request:
    paths: ['platform-cms/**', 'production/**', '.github/workflows/site-*.yml']
  push:
    branches: [main, production-foundation-20261019]
    paths: ['platform-cms/**', 'production/**', '.github/workflows/site-*.yml']
permissions:
  contents: read
concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform-cms/package-lock.json
      - name: Install locked application dependencies
        working-directory: platform-cms
        run: npm ci --no-audit --no-fund
      - name: Verify pinned build against full source reconstruction
        working-directory: platform-cms
        run: npm run prepare:pages:verify
      - name: Prepare exact public source templates
        working-directory: platform-cms
        run: npm run prepare:pages
      - name: Check types and content/access/isolation contracts
        working-directory: platform-cms
        run: npm run check && npm test
      - name: Verify real local HTTP lifecycle and public projections
        working-directory: platform-cms
        run: |
          npm run setup:local
          SITES_PERMISSIONS_TEST=1 npm run dev > /tmp/derech-cms-ci.log 2>&1 &
          cms_pid=$!
          trap 'result=$?; kill "$cms_pid" 2>/dev/null || true; if [ "$result" -ne 0 ]; then tail -n 100 /tmp/derech-cms-ci.log; fi' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5174/ > /dev/null; then ready=1; break; fi
            if ! kill -0 "$cms_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          test "$ready" -eq 1
          npm run test:http
          npm run test:admin-http
          npm run test:tasks-http
          node scripts/test-current-collections-http.mjs
      - name: Build shared CMS
        working-directory: platform-cms
        run: npm run build
      - name: Verify export and SEO source boundaries
        run: |
          python3 -m unittest discover -s production -p 'test_*.py'
          python3 -m unittest discover -s production/seo -p 'test_*.py'
