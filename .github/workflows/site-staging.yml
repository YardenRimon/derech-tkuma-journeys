name: Deploy site staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: derech-site-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    # This workflow cannot replace the public domain or deploy an arbitrary PR.
    if: github.ref == 'refs/heads/main'
    environment: derech-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s production -p 'test_*.py'
      - name: Configure the scoped deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SITE_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/derech-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/derech-deploy" "$HOME/.ssh/known_hosts"
      - name: Upload and activate the verified staging release
        env:
          DEPLOY_HOST: ${{ vars.SITE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.SITE_DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test "$DEPLOY_USER" != root
          tar --exclude='site' --exclude='receipts' --exclude='__pycache__' --exclude='.env' -czf /tmp/site-code.tar.gz -C production .
          sha256sum /tmp/site-code.tar.gz | cut -d ' ' -f 1 > /tmp/site-code.sha256
          scp -i "$HOME/.ssh/derech-deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/site-code.tar.gz /tmp/site-code.sha256 "$DEPLOY_USER@$DEPLOY_HOST:incoming/"
          ssh -i "$HOME/.ssh/derech-deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/derech-site-activate $GITHUB_SHA"
      - name: Remove the temporary deployment key
        if: always()
        run: rm -f "$HOME/.ssh/derech-deploy"
