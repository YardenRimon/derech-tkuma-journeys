server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /healthz { access_log off; return 200 'ok\n'; }
    # Only the deliberately public, published-only CMS projection crosses this boundary.
    location ~ ^/api/content/(tours|occurrences)$ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=30s;
        set $cms_upstream cms:80;
        rewrite ^/api/content/(.*)$ /?rest_route=/derech/v1/$1 break;
        proxy_pass http://$cms_upstream;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
    location ~ ^/(wp-admin|wp-json|wp-login\.php|xmlrpc\.php|cart|checkout)(/|$) { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~* \.(php|sql|sqlite|env|log|bak|zip|tar|gz)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
