name: derech-site-staging
services:
  database:
    image: ${DATABASE_IMAGE:?Resolve and pin the official MariaDB image digest}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: derech_cms
      MARIADB_USER: derech_cms
      MARIADB_PASSWORD_FILE: /run/secrets/database_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/database_root_password
    secrets: [database_password, database_root_password]
    volumes: [database:/var/lib/mysql]
    networks: [database]
    mem_limit: 384m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 15s
      timeout: 5s
      retries: 12
  cms:
    image: ${WORDPRESS_IMAGE:?Resolve and pin the official WordPress image digest}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports: [127.0.0.1:8783:80]
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_USER: derech_cms
      WORDPRESS_DB_NAME: derech_cms
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/database_password
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'staging');
        define('DISALLOW_FILE_EDIT', true);
        define('DISALLOW_FILE_MODS', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_HTTP_BLOCK_EXTERNAL', true);
        define('WP_POST_REVISIONS', 30);
        define('DISABLE_WP_CRON', true);
        define('DERECH_EXTERNAL_ACTIONS_ENABLED', false);
    secrets: [database_password]
    volumes:
      - wordpress:/var/www/html
      - ./wordpress/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    networks: [database, cms]
    mem_limit: 384m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
  frontend:
    image: ${FRONTEND_IMAGE:?Resolve and pin the official unprivileged nginx image digest}
    restart: unless-stopped
    ports: [127.0.0.1:8782:8080]
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs: [/tmp:size=32m, /var/cache/nginx:size=16m, /var/run:size=1m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    networks: [cms]
networks:
  database:
    internal: true
  cms:
volumes:
  database:
  wordpress:
secrets:
  database_password:
    file: /etc/derech-site/secrets/database_password
  database_root_password:
    file: /etc/derech-site/secrets/database_root_password
